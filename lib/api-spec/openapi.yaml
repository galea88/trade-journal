openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Trading Journal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trades
    description: Trade log operations
  - name: strategies
    description: Playbook / strategy operations
  - name: dashboard
    description: Dashboard summary
  - name: analytics
    description: Performance analytics
  - name: calendar
    description: Calendar view

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Trades ──────────────────────────────────────────────────────────────────
  /trades:
    get:
      operationId: listTrades
      tags: [trades]
      summary: List all trades for the authenticated user
      parameters:
        - in: query
          name: assetType
          schema:
            type: string
            enum: [stock, forex, crypto]
          required: false
        - in: query
          name: strategyId
          schema:
            type: integer
          required: false
        - in: query
          name: date
          description: Filter trades by entry date (YYYY-MM-DD)
          schema:
            type: string
            format: date
          required: false
      responses:
        "200":
          description: List of trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTrade
      tags: [trades]
      summary: Create a new trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTradeInput"
      responses:
        "201":
          description: Created trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /trades/{id}:
    get:
      operationId: getTrade
      tags: [trades]
      summary: Get a single trade by ID
      parameters:
        - $ref: "#/components/parameters/TradeId"
      responses:
        "200":
          description: Trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateTrade
      tags: [trades]
      summary: Update a trade
      parameters:
        - $ref: "#/components/parameters/TradeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTradeInput"
      responses:
        "200":
          description: Updated trade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTrade
      tags: [trades]
      summary: Delete a trade
      parameters:
        - $ref: "#/components/parameters/TradeId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Strategies ───────────────────────────────────────────────────────────────
  /strategies:
    get:
      operationId: listStrategies
      tags: [strategies]
      summary: List all strategies for the authenticated user
      responses:
        "200":
          description: List of strategies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Strategy"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createStrategy
      tags: [strategies]
      summary: Create a new strategy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStrategyInput"
      responses:
        "201":
          description: Created strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strategy"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /strategies/{id}:
    put:
      operationId: updateStrategy
      tags: [strategies]
      summary: Update a strategy
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStrategyInput"
      responses:
        "200":
          description: Updated strategy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Strategy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteStrategy
      tags: [strategies]
      summary: Delete a strategy
      parameters:
        - $ref: "#/components/parameters/StrategyId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Dashboard ─────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary metrics for the authenticated user
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Analytics ─────────────────────────────────────────────────────────────
  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Get analytics data including equity curve and breakdowns
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Calendar ──────────────────────────────────────────────────────────────
  /calendar/daily:
    get:
      operationId: getCalendarDaily
      tags: [calendar]
      summary: Get daily P&L summary for calendar view
      parameters:
        - in: query
          name: year
          schema:
            type: integer
          required: false
        - in: query
          name: month
          schema:
            type: integer
          required: false
      responses:
        "200":
          description: Daily P&L entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyPnl"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  parameters:
    TradeId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    StrategyId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Trade:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        strategyId:
          type: integer
          nullable: true
        asset:
          type: string
        assetType:
          type: string
          enum: [stock, forex, crypto]
        direction:
          type: string
          enum: [long, short]
        entryPrice:
          type: string
        exitPrice:
          type: string
          nullable: true
        quantity:
          type: string
        fees:
          type: string
        entryDate:
          type: string
          format: date-time
        exitDate:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        stopLoss:
          type: string
          nullable: true
        takeProfit:
          type: string
          nullable: true
        pnl:
          type: number
          nullable: true
          description: Calculated P&L for closed trades
        riskReward:
          type: number
          nullable: true
          description: Calculated risk-reward ratio
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - asset
        - assetType
        - direction
        - entryPrice
        - quantity
        - fees
        - entryDate
        - createdAt
        - updatedAt

    CreateTradeInput:
      type: object
      properties:
        strategyId:
          type: integer
          nullable: true
        asset:
          type: string
        assetType:
          type: string
          enum: [stock, forex, crypto]
        direction:
          type: string
          enum: [long, short]
        entryPrice:
          type: string
        exitPrice:
          type: string
          nullable: true
        quantity:
          type: string
        fees:
          type: string
        entryDate:
          type: string
          format: date-time
        exitDate:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        stopLoss:
          type: string
          nullable: true
        takeProfit:
          type: string
          nullable: true
      required:
        - asset
        - assetType
        - direction
        - entryPrice
        - quantity
        - fees
        - entryDate

    UpdateTradeInput:
      type: object
      properties:
        strategyId:
          type: integer
          nullable: true
        asset:
          type: string
        assetType:
          type: string
          enum: [stock, forex, crypto]
        direction:
          type: string
          enum: [long, short]
        entryPrice:
          type: string
        exitPrice:
          type: string
          nullable: true
        quantity:
          type: string
        fees:
          type: string
        entryDate:
          type: string
          format: date-time
        exitDate:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        stopLoss:
          type: string
          nullable: true
        takeProfit:
          type: string
          nullable: true

    Strategy:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, name, createdAt, updatedAt]

    CreateStrategyInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
      required: [name]

    DashboardSummary:
      type: object
      properties:
        totalPnl:
          type: number
        winRate:
          type: number
        totalTrades:
          type: integer
        openTrades:
          type: integer
        closedTrades:
          type: integer
        avgWin:
          type: number
        avgLoss:
          type: number
        recentTrades:
          type: array
          items:
            $ref: "#/components/schemas/Trade"
      required:
        - totalPnl
        - winRate
        - totalTrades
        - openTrades
        - closedTrades
        - avgWin
        - avgLoss
        - recentTrades

    EquityPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        cumulativePnl:
          type: number
        tradeCount:
          type: integer
      required: [date, cumulativePnl, tradeCount]

    BreakdownEntry:
      type: object
      properties:
        label:
          type: string
        pnl:
          type: number
        tradeCount:
          type: integer
        winRate:
          type: number
      required: [label, pnl, tradeCount, winRate]

    AnalyticsSummary:
      type: object
      properties:
        winRate:
          type: number
        profitFactor:
          type: number
        avgWin:
          type: number
        avgLoss:
          type: number
        avgRiskReward:
          type: number
        equityCurve:
          type: array
          items:
            $ref: "#/components/schemas/EquityPoint"
        byAssetType:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownEntry"
        byStrategy:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownEntry"
      required:
        - winRate
        - profitFactor
        - avgWin
        - avgLoss
        - avgRiskReward
        - equityCurve
        - byAssetType
        - byStrategy

    DailyPnl:
      type: object
      properties:
        date:
          type: string
          format: date
        pnl:
          type: number
        tradeCount:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
      required: [date, pnl, tradeCount, wins, losses]

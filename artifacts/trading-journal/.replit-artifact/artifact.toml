kind = "web"
previewPath = "/"
title = "Trading Journal"
version = "1.0.0"
id = "artifacts/trading-journal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21194

[services.development]
run = "npm run dev -w @workspace/trading-journal"

[services.production]
build = [ "sh", "-c", "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY NEXT_PUBLIC_CLERK_PROXY_URL=${CLERK_PROXY_URL:-} npm run build -w @workspace/trading-journal" ]
run = "npm run start -w @workspace/trading-journal"

[services.env]
PORT = "21194"
BASE_PATH = "/"
